<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111111;
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }
    .ig-frame {
      width: 1080px;
      height: 1350px;
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .carousel-viewport {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      position: relative;
    }
    .carousel-track {
      display: flex;
      height: 100%;
      width: 700%;
    }
    .slide {
      width: 1080px;
      height: 1350px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 100px 80px;
    }
    .headline {
      font-size: 85px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-top: 40px;
    }
    .highlight-red {
      color: #E60000;
    }
    .subheadline {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.3;
      color: #666666;
      margin-top: 20px;
      max-width: 800px;
    }
    .body-text {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.5;
      color: #333333;
      margin-top: 30px;
      max-width: 850px;
    }
    .hero-graphic {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 60px;
      margin-bottom: 60px;
    }
    .hero-graphic img {
      max-width: 90%;
      max-height: 500px;
      object-fit: contain;
    }
    .cta-text {
      font-size: 36px;
      font-weight: 600;
      line-height: 1.3;
      color: #111111;
      margin-top: 40px;
      text-align: center;
    }
    .cta-highlight {
      color: #E60000;
    }
    .swipe-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      color: #999999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 40px;
      border-top: 1px solid #E5E5E5;
    }
    .slide-number {
      font-size: 20px;
      font-weight: 600;
      color: #999999;
    }
    .handle {
      font-size: 20px;
      font-weight: 600;
      color: #111111;
    }
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #E5E5E5;
    }
    .dot.active {
      background: #E60000;
    }
  </style>
</head>
<body>

<div class="ig-frame">
  <div class="carousel-viewport">
    <div class="carousel-track">
      
      {{SLIDES}}

    </div>
  </div>
</div>

</body>
</html>
